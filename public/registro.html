<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="card auth-box p-4">
    <h4 class="text-center mb-3">🌱 Crear cuenta</h4>
    <input id="nombre" class="form-control mb-2" placeholder="Nombre">
    <input id="apellido" class="form-control mb-2" placeholder="Apellido">
    <input id="correo" type="email" class="form-control mb-2" placeholder="correo@live.uleam.edu.ec">
    <input id="clave" type="password" class="form-control mb-3" placeholder="Contraseña (mín. 6 caracteres)">
    <button id="btn" class="btn btn-agro w-100" onclick="registrar()">Registrarme</button>
    <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    async function registrar() {
      const nombre = document.getElementById("nombre").value.trim();
      const apellido = document.getElementById("apellido").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const clave = document.getElementById("clave").value;

      if (!nombre || !apellido || !correo || !clave) {
        return mostrarToast("Completa todos los campos", "warning");
      }
      if (!esCorreoUleam(correo)) {
        return mostrarToast("Usa tu correo institucional de la ULEAM", "warning");
      }

      const btn = document.getElementById("btn");
      btn.disabled = true;
      let cred = null;
      try {
        cred = await auth.createUserWithEmailAndPassword(correo, clave);
        await crearUsuarioDB(cred.user.uid, { nombre, apellido, correo });
        window.location.href = "/catalogo.html";
      } catch (err) {
        // Si falló el perfil, borramos la cuenta de Auth para no dejar usuarios a medias
        if (cred && cred.user) await cred.user.delete();
        mostrarToast(traducirError(err), "danger");
        btn.disabled = false;
      }
    }

    function traducirError(err) {
      const m = {
        "auth/email-already-in-use": "Ese correo ya está registrado",
        "auth/weak-password": "La contraseña debe tener al menos 6 caracteres",
        "auth/invalid-email": "Correo inválido"
      };
      return m[err.code] || err.message;
    }
  </script>
</body>
</html>
