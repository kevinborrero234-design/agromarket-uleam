<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-agro px-3">
    <span class="navbar-brand">🌱 Productos y stock</span>
    <div>
      <a class="btn btn-light btn-sm" href="/admin/dashboard.html">Panel</a>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card p-3 mb-4">
      <h5>Nuevo producto</h5>
      <div class="row g-2">
        <div class="col-md-4"><input id="np-nombre" class="form-control" placeholder="Nombre (ej: Tomate riñón)"></div>
        <div class="col-md-3"><select id="np-categoria" class="form-select"></select></div>
        <div class="col-md-2"><input id="np-precio" type="number" step="0.01" min="0" class="form-control" placeholder="Precio $"></div>
        <div class="col-md-3">
          <select id="np-unidad" class="form-select">
            <option>unidad</option><option>kg</option><option>libra</option>
            <option>atado</option><option>litro</option>
          </select>
        </div>
        <div class="col-md-3"><input id="np-stock" type="number" step="0.01" min="0" class="form-control" placeholder="Stock inicial"></div>
        <div class="col-md-6"><input id="np-img" type="file" accept="image/*" class="form-control"></div>
        <div class="col-md-3"><button id="btn-guardar" class="btn btn-agro w-100" onclick="guardarProducto()">Guardar producto</button></div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle bg-white">
        <thead><tr>
          <th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
        </tr></thead>
        <tbody id="tabla"></tbody>
      </table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    protegerPagina(["administrador"]);

    let categorias = [];
    let productos = [];

    async function iniciarPagina(usuario) {
      categorias = await listarCategorias();
      if (categorias.length === 0) {
        mostrarToast("No hay categorías: ejecuta cargarDatosIniciales() en la consola", "warning");
      }
      document.getElementById("np-categoria").innerHTML =
        categorias.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join("");
      await pintarProductos();
    }

    async function pintarProductos() {
      productos = await listarProductos();
      const tbody = document.getElementById("tabla");
      if (productos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Aún no hay productos</td></tr>';
        return;
      }
      tbody.innerHTML = productos.map(p => `
        <tr>
          <td>
            ${p.imagen_url
              ? `<img src="${esc(p.imagen_url)}" width="48" height="48" class="rounded me-2" style="object-fit:cover">`
              : "🥬 "}
            ${esc(p.nombre)}
          </td>
          <td>${esc(p.categoria_nombre)}</td>
          <td>$${Number(p.precio).toFixed(2)} / ${esc(p.unidad)}</td>
          <td>${p.stock_actual}</td>
          <td><span class="badge ${p.activo ? "bg-success" : "bg-secondary"}">${p.activo ? "Activo" : "Oculto"}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-success" onclick="sumarStock('${p.id}')">+ Stock</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="alternarActivo('${p.id}')">${p.activo ? "Ocultar" : "Mostrar"}</button>
          </td>
        </tr>`).join("");
    }

    async function guardarProducto() {
      const nombre = document.getElementById("np-nombre").value.trim();
      const categoriaId = document.getElementById("np-categoria").value;
      const precio = parseFloat(document.getElementById("np-precio").value);
      const unidad = document.getElementById("np-unidad").value;
      const stock = parseFloat(document.getElementById("np-stock").value);

      if (!nombre || !categoriaId || isNaN(precio) || precio <= 0 || isNaN(stock) || stock < 0) {
        return mostrarToast("Revisa los campos del producto", "warning");
      }

      const btn = document.getElementById("btn-guardar");
      btn.disabled = true;
      try {
        const archivo = document.getElementById("np-img").files[0];
        let imagen_url = null;
        if (archivo) imagen_url = await subirImagen(archivo, "productos");

        const cat = categorias.find(c => c.id === categoriaId);
        await crearProducto({
          nombre, precio, unidad,
          stock_actual: stock,
          categoria_id: categoriaId,
          categoria_nombre: cat.nombre,
          imagen_url
        }, window.usuarioActual.uid);

        ["np-nombre", "np-precio", "np-stock", "np-img"].forEach(id =>
          document.getElementById(id).value = "");
        mostrarToast("Producto guardado");
        await pintarProductos();
      } catch (err) {
        mostrarToast(err.message, "danger");
      } finally {
        btn.disabled = false;
      }
    }

    async function sumarStock(id) {
      const cantidad = parseFloat(prompt("¿Cuánto stock agregar?"));
      if (isNaN(cantidad) || cantidad <= 0) return;
      try {
        await agregarStock(id, cantidad, "Reposición", window.usuarioActual.uid);
        mostrarToast("Stock actualizado");
        await pintarProductos();
      } catch (err) {
        mostrarToast(err.message, "danger");
      }
    }

    async function alternarActivo(id) {
      const p = productos.find(x => x.id === id);
      await actualizarProducto(id, { activo: !p.activo });
      await pintarProductos();
    }
  </script>
</body>
</html>
