<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Admin — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-agro px-3">
    <span class="navbar-brand">🌱 Panel de administración</span>
    <div>
      <a class="btn btn-light btn-sm" href="/catalogo.html">Ver tienda</a>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>
  <div class="container mt-4">
    <h4 id="saludo">Cargando...</h4>
    <div class="row mt-3">
      <div class="col-md-4">
        <a href="/admin/productos.html" class="card card-producto p-4 text-center text-decoration-none">
          <h5>📦 Productos y stock</h5>
        </a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    protegerPagina(["administrador"]);
    function iniciarPagina(usuario) {
      document.getElementById("saludo").textContent = "Bienvenido, " + usuario.nombre;
    }
  </script>
</body>
</html>
