<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-agro px-3">
    <span class="navbar-brand">🛒 Mi carrito</span>
    <div class="d-flex gap-2">
      <a class="btn btn-light btn-sm" href="/catalogo.html">Seguir comprando</a>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div id="vacio" class="text-center text-muted py-5" style="display:none">
      <p class="fs-4">Tu carrito está vacío</p>
      <a href="/catalogo.html" class="btn btn-agro">Ir al catálogo</a>
    </div>

    <div id="contenido" style="display:none">
      <div class="table-responsive">
        <table class="table align-middle bg-white">
          <thead><tr><th>Producto</th><th>Precio</th><th style="width:150px">Cantidad</th><th>Subtotal</th><th></th></tr></thead>
          <tbody id="tabla"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <button class="btn btn-outline-danger btn-sm" id="btn-vaciar">Vaciar carrito</button>
        <div class="text-end">
          <div class="fs-5">Subtotal: <strong id="total"></strong></div>
          <small class="text-muted">El costo de envío se calcula al confirmar</small><br>
          <a href="/checkout.html" class="btn btn-agro mt-2">Confirmar pedido</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/carrito.js"></script>
  <script>
    protegerPagina(["cliente", "administrador"]);
    const carrito = new Carrito();

    async function iniciarPagina(usuario) {
      // Traer el catálogo actual para validar precios y stock
      const mapa = {};
      const actuales = await Promise.all(carrito.items.map(i => obtenerProducto(i.producto_id)));
      actuales.forEach(p => { if (p) mapa[p.id] = p; });
      carrito.sincronizar(mapa).forEach(a => mostrarToast(a, "warning"));

      document.getElementById("tabla").addEventListener("change", onCambioCantidad);
      document.getElementById("tabla").addEventListener("click", onClickQuitar);
      document.getElementById("btn-vaciar").addEventListener("click", () => {
        carrito.vaciar();
        pintar();
      });
      pintar();
    }

    function pintar() {
      const hay = carrito.cantidadItems() > 0;
      document.getElementById("vacio").style.display = hay ? "none" : "block";
      document.getElementById("contenido").style.display = hay ? "block" : "none";
      if (!hay) return;

      document.getElementById("tabla").innerHTML = carrito.items.map(i => `
        <tr>
          <td>
            ${i.imagen_url
              ? `<img src="${esc(i.imagen_url)}" width="48" height="48" class="rounded me-2" style="object-fit:cover">`
              : "🥬 "}
            ${esc(i.nombre)}
          </td>
          <td>$${Number(i.precio).toFixed(2)} / ${esc(i.unidad)}</td>
          <td>
            <input type="number" class="form-control form-control-sm"
                   data-id="${esc(i.producto_id)}" value="${i.cantidad}"
                   min="${pasoDe(i.unidad)}" max="${i.stock_max}" step="${pasoDe(i.unidad)}">
          </td>
          <td>$${(i.precio * i.cantidad).toFixed(2)}</td>
          <td><button class="btn btn-sm btn-outline-danger" data-quitar="${esc(i.producto_id)}">✕</button></td>
        </tr>`).join("");
      document.getElementById("total").textContent = "$" + carrito.subtotal().toFixed(2);
    }

    function onCambioCantidad(e) {
      const input = e.target.closest("input[data-id]");
      if (!input) return;
      const r = carrito.cambiarCantidad(input.dataset.id, parseFloat(input.value));
      if (!r.ok) mostrarToast(r.mensaje, "warning");
      pintar();
    }

    function onClickQuitar(e) {
      const btn = e.target.closest("[data-quitar]");
      if (!btn) return;
      carrito.quitar(btn.dataset.quitar);
      pintar();
    }
  </script>
</body>
</html>
