<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar pedido — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-agro px-3">
    <span class="navbar-brand">✅ Confirmar pedido</span>
    <a class="btn btn-light btn-sm" href="/carrito.html">Volver al carrito</a>
  </nav>

  <div class="container mt-4 mb-5">
    <div class="row g-4">
      <div class="col-md-7">
        <div class="card p-3">
          <h5>1. Tipo de entrega</h5>
          <div class="mb-3">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="tipo" id="tipo-delivery" value="delivery" checked>
              <label class="form-check-label" for="tipo-delivery">🛵 Delivery</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="tipo" id="tipo-retiro" value="retiro">
              <label class="form-check-label" for="tipo-retiro">🏪 Retiro en el Agro Market</label>
            </div>
          </div>

          <div id="bloque-delivery">
            <label class="form-label">Bloque</label>
            <select id="zona" class="form-select mb-2"></select>
            <div class="row g-2">
              <div class="col-6"><input id="piso" class="form-control" placeholder="Piso (ej: 1)"></div>
              <div class="col-6"><input id="aula" class="form-control" placeholder="Aula (ej: 101)"></div>
            </div>
            <input id="referencia" class="form-control mt-2" placeholder="Referencia (opcional): junto a la puerta...">
          </div>
        </div>

        <div class="card p-3 mt-3">
          <h5>2. Forma de pago</h5>
          <select id="forma-pago" class="form-select">
            <option value="efectivo">💵 Efectivo (pago al recibir)</option>
            <option value="transferencia">🏦 Transferencia</option>
          </select>
          <div id="campo-comprobante" class="mt-3" style="display:none">
            <div class="alert alert-light border">
              <strong>Datos para transferir:</strong><br>
              Banco: ________ · Cuenta: ________ · Titular: ________
            </div>
            <label class="form-label">Comprobante de transferencia *</label>
            <input id="comprobante" type="file" accept="image/*" class="form-control">
          </div>
        </div>

        <div class="card p-3 mt-3">
          <h5>3. Notas (opcional)</h5>
          <textarea id="notas" class="form-control" rows="2" placeholder="Ej: no subas al piso 2"></textarea>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card p-3">
          <h5>Resumen</h5>
          <ul id="lista" class="list-group list-group-flush mb-3"></ul>
          <div class="d-flex justify-content-between"><span>Subtotal</span><span id="r-subtotal"></span></div>
          <div class="d-flex justify-content-between"><span>Envío</span><span id="r-envio"></span></div>
          <hr>
          <div class="d-flex justify-content-between fs-5"><strong>Total</strong><strong id="r-total"></strong></div>
          <button id="btn-confirmar" class="btn btn-agro w-100 mt-3">Realizar pedido</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/carrito.js"></script>
  <script src="/js/pagos.js"></script>
  <script>
    protegerPagina(["cliente", "administrador"]);

    const carrito = new Carrito();
    let zonas = [];

    async function iniciarPagina(usuario) {
      // Validar el carrito contra el catálogo actual
      const mapa = {};
      const actuales = await Promise.all(carrito.items.map(i => obtenerProducto(i.producto_id)));
      actuales.forEach(p => { if (p) mapa[p.id] = p; });
      carrito.sincronizar(mapa).forEach(a => mostrarToast(a, "warning"));
      if (carrito.cantidadItems() === 0) {
        window.location.href = "/catalogo.html";
        return;
      }

      zonas = (await listarZonas()).filter(z => z.activo);
      document.getElementById("zona").innerHTML = zonas.map(z =>
        `<option value="${esc(z.id)}">${esc(z.nombre)} (envío $${Number(z.tarifa).toFixed(2)})</option>`).join("");

      document.querySelectorAll('input[name="tipo"]').forEach(r => r.addEventListener("change", alternarEntrega));
      document.getElementById("zona").addEventListener("change", pintarResumen);
      document.getElementById("forma-pago").addEventListener("change", alternarPago);
      document.getElementById("btn-confirmar").addEventListener("click", confirmarPedido);

      document.getElementById("lista").innerHTML = carrito.items.map(i => `
        <li class="list-group-item d-flex justify-content-between px-0">
          <span>${esc(i.nombre)} × ${i.cantidad} ${esc(i.unidad)}</span>
          <span>$${(i.precio * i.cantidad).toFixed(2)}</span>
        </li>`).join("");
      pintarResumen();
    }

    const tipoActual = () => document.querySelector('input[name="tipo"]:checked').value;

    function tarifaActual() {
      if (tipoActual() !== "delivery") return 0;
      const z = zonas.find(x => x.id === document.getElementById("zona").value);
      return z ? Number(z.tarifa) : 0;
    }

    function alternarEntrega() {
      document.getElementById("bloque-delivery").style.display =
        tipoActual() === "delivery" ? "block" : "none";
      pintarResumen();
    }

    function alternarPago() {
      document.getElementById("campo-comprobante").style.display =
        document.getElementById("forma-pago").value === "transferencia" ? "block" : "none";
    }

    function pintarResumen() {
      const subtotal = carrito.subtotal();
      const envio = tarifaActual();
      document.getElementById("r-subtotal").textContent = "$" + subtotal.toFixed(2);
      document.getElementById("r-envio").textContent = "$" + envio.toFixed(2);
      document.getElementById("r-total").textContent = "$" + (subtotal + envio).toFixed(2);
    }

    async function confirmarPedido() {
      const tipo = tipoActual();
      const zona_id = document.getElementById("zona").value;
      const piso = document.getElementById("piso").value.trim();
      const aula = document.getElementById("aula").value.trim();
      const referencia = document.getElementById("referencia").value.trim();
      const notas = document.getElementById("notas").value.trim();

      if (tipo === "delivery" && (!zona_id || !piso || !aula)) {
        return mostrarToast("Indica bloque, piso y aula para la entrega", "warning");
      }

      // STRATEGY: se elige la estrategia según la forma de pago
      const estrategia = ESTRATEGIAS_PAGO[document.getElementById("forma-pago").value];
      const archivo = document.getElementById("comprobante").files[0];
      const validacion = estrategia.validar({ archivo });
      if (!validacion.ok) return mostrarToast(validacion.mensaje, "warning");

      const btn = document.getElementById("btn-confirmar");
      btn.disabled = true;
      btn.textContent = "Procesando...";
      try {
        const pago = await estrategia.procesar({ archivo });
        await crearPedido({
          usuario: window.usuarioActual,
          items: carrito.items,
          tipo, zona_id, piso, aula, referencia, notas, pago
        });
        carrito.vaciar();
        mostrarToast("¡Pedido realizado con éxito!");
        setTimeout(() => window.location.href = "/mis-pedidos.html", 1200);
      } catch (err) {
        mostrarToast(err.message, "danger");
        btn.disabled = false;
        btn.textContent = "Realizar pedido";
      }
    }
  </script>
</body>
</html>
