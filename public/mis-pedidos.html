<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pedidos — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-agro px-3">
    <span class="navbar-brand">📋 Mis pedidos</span>
    <div class="d-flex gap-2">
      <a class="btn btn-light btn-sm" href="/catalogo.html">Catálogo</a>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div id="lista"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    protegerPagina(["cliente", "administrador"]);

    async function iniciarPagina(usuario) {
      const pedidos = await listarPedidosCliente(usuario.uid);
      const cont = document.getElementById("lista");
      if (pedidos.length === 0) {
        cont.innerHTML = '<p class="text-muted text-center py-5">Aún no has hecho pedidos.</p>';
        return;
      }
      cont.innerHTML = pedidos.map(p => {
        const e = ETIQUETAS_ESTADO[p.estado] || { texto: p.estado, clase: "bg-secondary" };
        const fecha = p.created_at ? p.created_at.toDate().toLocaleString("es-EC") : "";
        return `
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between flex-wrap gap-2">
              <div>
                <strong>Pedido #${esc(p.id.slice(-6).toUpperCase())}</strong>
                <small class="text-muted ms-2">${esc(fecha)}</small>
              </div>
              <span class="badge ${e.clase} align-self-start">${e.texto}</span>
            </div>
            <ul class="mt-2 mb-2">
              ${p.detalles.map(d => `<li>${esc(d.nombre_producto)} × ${d.cantidad} ${esc(d.unidad)} — $${Number(d.subtotal).toFixed(2)}</li>`).join("")}
            </ul>
            <div class="small text-muted">
              ${p.tipo === "delivery" ? "🛵" : "🏪"} ${esc(p.direccion_entrega)} ·
              ${p.forma_pago === "efectivo" ? "💵 Efectivo" : "🏦 Transferencia"}
            </div>
            <div class="mt-2 fw-bold">Total: $${Number(p.total).toFixed(2)}
              <span class="fw-normal text-muted">(envío $${Number(p.tarifa_envio).toFixed(2)})</span>
            </div>
          </div>
        </div>`;
      }).join("");
    }
  </script>
</body>
</html>
