<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar — Agro Market ULEAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="card auth-box p-4">
    <h4 class="text-center mb-3">🌱 Agro Market ULEAM</h4>
    <input id="correo" type="email" class="form-control mb-2" placeholder="Correo institucional">
    <input id="clave" type="password" class="form-control mb-3" placeholder="Contraseña">
    <button id="btn" class="btn btn-agro w-100" onclick="ingresar()">Ingresar</button>
    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/modelos.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/db.js"></script>
  <script>
    async function ingresar() {
      const correo = document.getElementById("correo").value.trim();
      const clave = document.getElementById("clave").value;
      if (!correo || !clave) return mostrarToast("Ingresa correo y contraseña", "warning");

      const btn = document.getElementById("btn");
      btn.disabled = true;
      try {
        const cred = await auth.signInWithEmailAndPassword(correo, clave);
        const usuario = await obtenerUsuario(cred.user.uid);
        if (!usuario || !usuario.activo) {
          await auth.signOut();
          throw new Error("Tu cuenta no existe o está desactivada");
        }
        // Polimorfismo: cada rol sabe cuál es su página de inicio
        window.location.href = usuario.rutaInicio();
      } catch (err) {
        const msg = (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password")
          ? "Correo o contraseña incorrectos" : err.message;
        mostrarToast(msg, "danger");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
